<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>35 - Transformations</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        section{
            img{
                display: block;
                width: 180px;
                max-width: 100%;
                height: auto;
                margin: 1rem auto;

                &.transform1 {
                    transform: rotate(0.25turn); /*90deg*/
                }
                &.transform2 {
                    transform: scale(.5);
                }
                &.transform3 {
                    transform: translateX(-100px);
                }
                &.transform4 {
                    transform: skew(30deg);
                }
                &.transform5 {
                    transform: rotate(-45deg) scale(1.2);
                }

            }
        }
    </style>
</head>
<body class="css">
    <a href="index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256"><path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path></svg>
    </a>
        <main>
        <header class="mainmenu">
            <h1>35 - Transformations</h1>
            <h4>Property (transform) allowing 2D or 3D manipulation of elements, such as translate(), rotate(), scale(), and skew().</h4>
        </header>
        <section>
            <section>
            <h4>Rotación de 90°</h4>
            <img class="transform1" src="imgs/mario.png" alt="Mario rotated 90 degrees">
            <h4>Escala al 50%</h4>
            <img class="transform2" src="imgs/mario.png" alt="Mario scaled to half size">
            <h4>Traslación horizontal a la izquierda</h4>
            <img class="transform3" src="imgs/mario.png" alt="Mario translated to the left">
            <h4>Inclinación de 30°</h4>
            <img class="transform4" src="imgs/mario.png" alt="Mario skewed">
            <h4>Rotación de -45° y escala al 120%</h4>
            <img class="transform5" src="imgs/mario.png" alt="Mario rotated and scaled">

            </section>
        </section>
    </main>
</body>
</html>
