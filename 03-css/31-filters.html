<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>31 - Filters</title>
    <link rel="stylesheet" href="../css/master.css">
    <style>
        img.filter {
            width: 140px;
            display: block;
            margin: 1rem auto;
            outline: 2px solid white;
            border-radius: 14px;
            corner-shape: squircle;
            background: linear-gradient(45deg,red,blue );
            transition: all 0.2s ease-in;

            &.filter1{
                filter: grayscale(.8);
            }
            &.filter2{
                filter: blur(20px);
            }
            &.filter3{
                filter: Sepia(1);
            }
            &.filter4{
                filter: Brightness(.8);
            }
            &.filter5{
                filter: Invert(1);
            }
            &.filter6{
                filter: drop-shadow(0 0 12px white);
            }
            &.filter7{
                filter: hue-rotate(200deg);
            }

            &:hover{
                filter: none;
            }

        }
    </style>
</head>

<body class="css">
    <a href="index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256">
            <path
                d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z">
            </path>
        </svg>
    </a>
    <main>
        <header class="mainmenu">
            <h1>31 - Filters</h1>
            <h3>Property (filter) applying graphical transformations (e.g., blur(), grayscale(), contrast(),
                drop-shadow()) to elements before display.</h3>
        </header>
        <section>
            <h4>GrayScale</h4>
            <img class="filter filter1" src="imgs/inosuke.png" alt="Inosuke">
            <h4>Blur</h4>
            <img class="filter filter2" src="imgs/inosuke.png" alt="Inosuke">
            <h4>Sepia</h4>
            <img class="filter filter3" src="imgs/inosuke.png" alt="Inosuke">
            <h4>Brightness</h4>
            <img class="filter filter4" src="imgs/inosuke.png" alt="Inosuke">
            <h4>Invert</h4>
            <img class="filter filter5" src="imgs/inosuke.png" alt="Inosuke">
            <h4>Drop Shadow</h4>
            <img class="filter filter6" src="imgs/inosuke.png" alt="Inosuke">
            <h4>HUE Rotate</h4>
            <img class="filter filter7" src="imgs/inosuke.png" alt="Inosuke">
        </section>
    </main>
</body>

</html>
